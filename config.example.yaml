# Path to your OAuth client secrets file (download from Google Cloud Console)
client_secrets_file: "C:\\Users\\your_user\\.google\\oauth.keys.json"

# Path where the OAuth token will be saved after authentication
token_file: "C:\\Users\\your_user\\.google\\token.json"

# Directory for Apps Script backups (created automatically)
backup_dir: "C:\\Users\\your_user\\.google\\backups"

# Optional: path to log file (logs operations for audit/debugging)
log_file: "C:\\Users\\your_user\\.google\\mcp_operations.log"

# MCP authentication token (change to a secure random value)
mcp_auth_token: "change_me"

# Log level: DEBUG, INFO, WARNING, ERROR (default: INFO)
# Can also be set via the GOOGLE_LOG_LEVEL environment variable
log_level: "INFO"

# Tool profile — which MCP tools this deployment exposes at all.
#   full       — every tool (default, backwards compatible)
#   read-write — everything except destructive tools (delete, clear, revoke)
#   read-only  — only read tools (search, read, list, export)
# Can also be set via MCP_TOOL_PROFILE.
tool_profile: "full"

# Optional explicit allow/deny lists applied on top of the profile.
# Deny always wins over allow. Use MCP tool names from docs/TOOLS_REFERENCE.md.
# Env overrides: MCP_ALLOWED_TOOLS="a,b,c" / MCP_DENIED_TOOLS="x,y"
# allowed_tools: ["workspace_search", "find_files", "read_sheet", "read_email"]
# denied_tools: ["send_email", "share_file", "batch_delete_emails"]

# OAuth scopes define what data the server can access
# Default: Full access to all services (good for testing)
# For production: Review docs/SECURITY.md for minimal/read-only options
scopes:
  - "https://www.googleapis.com/auth/spreadsheets"           # Read/write Google Sheets
  - "https://www.googleapis.com/auth/drive"                   # Full access to Google Drive
  - "https://www.googleapis.com/auth/script.projects"         # Apps Script projects
  - "https://www.googleapis.com/auth/script.deployments"      # Apps Script deployments
  - "https://www.googleapis.com/auth/documents"               # Read/write Google Docs
  - "https://www.googleapis.com/auth/gmail.modify"            # Read/send/delete emails (includes read)
  - "https://www.googleapis.com/auth/gmail.settings.basic"    # Gmail filters
  - "https://www.googleapis.com/auth/calendar"                # Manage calendar events
  - "https://www.googleapis.com/auth/presentations"           # Google Slides
  - "https://www.googleapis.com/auth/tasks"                       # Google Tasks
  - "https://www.googleapis.com/auth/forms.body"                  # Google Forms (create/edit)
  - "https://www.googleapis.com/auth/forms.responses.readonly"    # Form responses
  - "https://www.googleapis.com/auth/postmaster.domain"
  - "https://www.googleapis.com/auth/postmaster.traffic.readonly"         # Postmaster domain stats


# Runtime behaviour
# dry_run: true  -> every non-read-only tool returns a preview instead of executing
dry_run: false

# JSONL audit trail: one line per tool call (tool, profile, status, duration, argument names)
# Leave empty to disable.
audit_log: ""

# Retries for transient Google API errors (429/5xx), exponential backoff
retry_attempts: 3

# Bulk operations (bulk_plan -> bulk_run). Caps are the safety layer against
# accidental mass changes; plans above max_items need allow_large=true.
bulk:
  dir: ""                  # default: ./data/bulk
  max_items: 300           # default cap for one plan
  hard_limit: 10000        # absolute ceiling with allow_large=true
  concurrency: 8           # parallel API workers (1-16)
  plan_ttl: 900            # seconds a reviewed plan stays valid
  protected_ids: []        # never touch these file ids
  protected_patterns: []   # never touch files matching these glob patterns
  allow_shared_drives: false

# Example: Read-only configuration (safer for exploration)
# Uncomment and replace the scopes above with:
# scopes:
#   - "https://www.googleapis.com/auth/spreadsheets.readonly"
#   - "https://www.googleapis.com/auth/drive.readonly"
#   - "https://www.googleapis.com/auth/documents.readonly"
#   - "https://www.googleapis.com/auth/gmail.readonly"
#   - "https://www.googleapis.com/auth/calendar.readonly"
