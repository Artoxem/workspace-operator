[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "workspace-operator-mcp"
version = "2.9.3"
description = "Deep Google Workspace automation for AI agents — Apps Script execution, local file transfer, Slides, document templates, cross-product search, and tool profiles"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "Artoxem" }
]
keywords = ["mcp", "model-context-protocol", "google", "gmail", "drive", "sheets", "docs", "slides", "calendar", "apps-script", "antigravity", "gemini-cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "google-api-python-client>=2.100.0,<3",
    "google-auth-httplib2>=0.2.0",
    "google-auth-oauthlib>=1.2.0",
    "mcp>=2.3.0,<3",
    "PyYAML>=6.0",
    "uvicorn>=0.30",
    "starlette>=0.40",
]

[project.scripts]
workspace-operator = "workspace_operator.cli:main"

[project.urls]
Homepage = "https://github.com/Artoxem/workspace-operator"
PyPI = "https://pypi.org/project/workspace-operator-mcp/"
Repository = "https://github.com/Artoxem/workspace-operator"
Documentation = "https://github.com/Artoxem/workspace-operator#readme"
Changelog = "https://github.com/Artoxem/workspace-operator/tree/master/docs"
Issues = "https://github.com/Artoxem/workspace-operator/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-PyYAML",
    "bandit>=1.7",
    "pip-audit>=2.7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["workspace_operator"]
branch = true

[tool.coverage.report]
# Ratchet: only ever raise this (prompts/resources/router are 95-100%).
fail_under = 56
show_missing = true
skip_empty = true

[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = ["docs", "antigravity", "skills"]

[tool.ruff.lint]
# Correctness (F), bugbear (B), security (S), imports (I) and pycodestyle errors/warnings.
select = ["E", "F", "W", "B", "S", "I"]
ignore = [
    "E501",  # long lines: tool definitions and prompts are data
    "S101",  # assert is fine in tests
    "S110", "S112",  # deliberate best-effort try/except pass in cleanup paths
    "S311",  # random is used for retry jitter, not security
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S104", "S105", "S106", "S107", "B017"]
"workspace_operator/http_transport.py" = ["S104"]  # bind address is validated by resolve_bind
"workspace_operator/handlers/__init__.py" = ["F401"]  # re-exports

[tool.bandit]
exclude_dirs = ["tests"]
# Same accepted risks as the ruff ignores above:
# - B310: urlopen targets a fixed https discovery URL (postmaster.py);
# - B311: random is retry jitter, not security (bulk/engine.py);
# - B110: best-effort try/except pass in a fallback path (google_clients.py).
skips = ["B310", "B311", "B110"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
check_untyped_defs = false
warn_unused_ignores = false
# Incremental adoption: new modules can opt in with strict settings.
files = ["workspace_operator"]

[tool.setuptools.packages.find]
where = ["."]
include = ["workspace_operator*"]

[tool.setuptools.package-data]
# Tool/prompt definitions are JSON data loaded at runtime.
"workspace_operator.definitions" = ["*.json"]
