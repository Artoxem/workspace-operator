services:
  workspace-operator:
    image: ghcr.io/artoxem/workspace-operator:latest
    build: .
    # Published to the host loopback only: the container is not reachable from
    # the network unless you change this mapping on purpose.
    ports:
      - "127.0.0.1:8765:8765"
    environment:
      MCP_CONFIG_FILE: /app/config.yaml
      # Required. Generate a long random value and keep it out of git.
      MCP_AUTH_TOKEN: "${MCP_AUTH_TOKEN:?set MCP_AUTH_TOKEN first}"
      MCP_AUDIT_LOG: /home/app/data/audit.jsonl
    volumes:
      - ./config.docker.yaml:/app/config.yaml:ro
      # OAuth client secrets and token. Read-write: the server refreshes the token
      # and writes it back after it expires.
      - "${GOOGLE_DIR:-${HOME}/.google}:/home/app/.google"
      - ./data:/home/app/data
    restart: unless-stopped
