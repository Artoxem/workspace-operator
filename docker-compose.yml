services:
  workspace-operator:
    build: .
    image: workspace-operator:latest
    # Published to the host loopback only: the container is not reachable from
    # the network unless you change this mapping on purpose.
    ports:
      - "127.0.0.1:8765:8765"
    environment:
      MCP_CONFIG_FILE: /app/config.yaml
      # Required. Generate a long random value and keep it out of git.
      MCP_AUTH_TOKEN: "${MCP_AUTH_TOKEN:?set MCP_AUTH_TOKEN first}"
      MCP_AUDIT_LOG: /data/audit.jsonl
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      # OAuth client secrets and token, read-only.
      - "${GOOGLE_DIR:-${HOME}/.google}:/root/.google:ro"
      - ./data:/data
    restart: unless-stopped
